<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --dim:#6e6e73; --line:#0000000f; --off:#d2d2d7; --on:#1d1d1f; --knob:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1d1f; --fg:#f5f5f7; --dim:#a1a1a6; --line:#ffffff14; --off:#48484a; --on:#f5f5f7; --knob:#1d1d1f; }
  }
  body { margin:0; width:260px; background:var(--bg); color:var(--fg);
         font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; }
  header { padding:14px 16px 10px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  label { display:flex; align-items:center; gap:12px; padding:10px 16px; border-top:1px solid var(--line); cursor:pointer; }
  label > span { flex:1; }
  small { display:block; color:var(--dim); font-size:12px; }
  input { appearance:none; margin:0; width:30px; height:18px; border-radius:9px; background:var(--off);
          position:relative; cursor:pointer; transition:background .15s; flex:none; }
  input::after { content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%;
                 background:var(--knob); transition:transform .15s; }
  input:checked { background:var(--on); }
  input:checked::after { transform:translateX(12px); }
  input:disabled { opacity:.4; cursor:default; }
  footer { padding:8px 16px 10px; border-top:1px solid var(--line); color:var(--dim); font-size:11px; }
  footer span { display:block; }
  #lifetime:not(:empty) { color:var(--fg); font-size:12px; margin-bottom:2px; }
  .na label, .na footer { display:none; }
  .na header { font-weight:400; color:var(--dim); }
</style>
</head>
<body>
  <header id="site"></header>
  <label><span>Block ads<small id="ads-n"></small></span><input type="checkbox" id="ads"></label>
  <label><span>Block redirects<small id="guard-n"></small></span><input type="checkbox" id="guard"></label>
  <footer><span id="lifetime"></span><span id="lists"></span></footer>
  <script src="popup.js"></script>
</body>
</html>
